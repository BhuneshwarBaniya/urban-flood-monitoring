
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Urban Flood Monitoring System</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 2rem;
            text-align: center;
        }

        h1 {
            margin-bottom: 1rem;
        }

        #connection_status {
            margin-bottom: 20px;
            font-weight: 600;
        }

        .connected {
            color: #22c55e;
        }

        .disconnected {
            color: #ef4444;
        }

        .waiting {
            color: #facc15;
        }

        .risk-banner {
            padding: 1.2rem;
            border-radius: 12px;
            font-size: 1.5rem;
            font-weight: 700;
            max-width: 800px;
            margin: 0 auto 2rem;
        }

        .risk-0 { background: #16a34a; }
        .risk-1 { background: #ca8a04; }
        .risk-2 { background: #ea580c; }
        .risk-3 { background: #dc2626; }

        .grid {
            display: grid;
            grid-template-columns: repeat(
                auto-fit,
                minmax(220px, 1fr)
            );
            gap: 1.2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 12px;
            border: 1px solid #334155;
        }

        .card h3 {
            margin: 0 0 0.5rem;
            font-size: 0.95rem;
            color: #94a3b8;
            text-transform: uppercase;
        }

        .value {
            font-size: 2rem;
            font-weight: 700;
            overflow-wrap: anywhere;
        }

        .footer {
            margin-top: 2rem;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .sensor-error {
            color: #ef4444;
        }

        .sensor-ok {
            color: #22c55e;
        }

        @media (max-width: 600px) {
            body {
                padding: 1rem;
            }

            h1 {
                font-size: 1.5rem;
            }

            .risk-banner {
                font-size: 1.2rem;
            }
        }
    </style>
</head>

<body>

    <h1>Urban Flood Warning Dashboard</h1>

    <div id="connection_status" class="waiting">
        Connecting to server...
    </div>

    <div id="risk-banner" class="risk-banner risk-0">
        STATUS:
        <span id="risk_label">WAITING FOR DATA</span>
    </div>

    <div class="grid">

        <div class="card">
            <h3>Water Depth</h3>
            <div class="value">
                <span id="water_depth">0.00</span> cm
            </div>
        </div>

        <div class="card">
            <h3>Rise Rate</h3>
            <div class="value">
                <span id="rise_rate">0.00</span> cm/min
            </div>
        </div>

        <div class="card">
            <h3>Sensor Distance</h3>
            <div class="value">
                <span id="distance">0.00</span> cm
            </div>
        </div>

        <div class="card">
            <h3>Rain Wetness</h3>
            <div class="value">
                <span id="wetness">0</span> %
            </div>
        </div>

        <div class="card">
            <h3>Rain Status</h3>
            <div class="value" id="rain_detected">
                Dry
            </div>
        </div>

        <div class="card">
            <h3>Buzzer Alarm</h3>
            <div class="value" id="buzzer">
                OFF
            </div>
        </div>

        <div class="card">
            <h3>Ultrasonic Sensor</h3>
            <div class="value" id="ultrasonic_status">
                Waiting
            </div>
        </div>

    </div>

    <div class="footer">
        Last Updated:
        <span id="last_updated">Never</span>
    </div>


    <script>

        // ==================================
        // GET ELEMENT
        // ==================================

        function setText(id, value) {
            document.getElementById(id).innerText = value;
        }


        // ==================================
        // FETCH SENSOR DATA AND MQTT STATUS
        // ==================================

        async function fetchTelemetry() {

            const status =
                document.getElementById("connection_status");

            try {

                const responses = await Promise.all([

                    fetch("/api/data?t=" + Date.now(), {
                        cache: "no-store"
                    }),

                    fetch("/api/status?t=" + Date.now(), {
                        cache: "no-store"
                    })

                ]);

                if (!responses[0].ok || !responses[1].ok) {
                    throw new Error("Server returned an error");
                }

                const data = await responses[0].json();
                const mqttStatus = await responses[1].json();


                // ==================================
                // MQTT CONNECTION STATUS
                // ==================================

                if (!mqttStatus.mqtt_connected) {

                    status.innerText =
                        "SERVER CONNECTED - MQTT DISCONNECTED";

                    status.className = "disconnected";

                } else if (
                    !data.last_updated ||
                    data.last_updated === "Never"
                ) {

                    status.innerText =
                        "MQTT CONNECTED - WAITING FOR SENSOR DATA";

                    status.className = "waiting";

                } else {

                    status.innerText =
                        "LIVE SENSOR DATA RECEIVED";

                    status.className = "connected";

                }


                // ==================================
                // WAIT IF NO SENSOR DATA
                // ==================================

                if (
                    !data.last_updated ||
                    data.last_updated === "Never"
                ) {
                    return;
                }


                // ==================================
                // SENSOR VALUES
                // ==================================

                setText(
                    "water_depth",
                    Number(data.water_depth ?? 0).toFixed(2)
                );

                setText(
                    "rise_rate",
                    Number(data.rise_rate ?? 0).toFixed(2)
                );

                setText(
                    "distance",
                    Number(data.distance ?? 0).toFixed(2)
                );

                setText(
                    "wetness",
                    Number(data.wetness ?? 0)
                );

                setText(
                    "rain_detected",
                    data.rain_detected ? "RAINING" : "DRY"
                );

                setText(
                    "buzzer",
                    data.buzzer ?? "OFF"
                );

                setText(
                    "last_updated",
                    data.last_updated
                );


                // ==================================
                // ULTRASONIC STATUS
                // ==================================

                const ultrasonic =
                    document.getElementById("ultrasonic_status");

                if (data.ultrasonic_valid === false) {

                    ultrasonic.innerText = "SENSOR ERROR";
                    ultrasonic.className = "value sensor-error";

                } else {

                    ultrasonic.innerText = "WORKING";
                    ultrasonic.className = "value sensor-ok";

                }


                // ==================================
                // FLOOD RISK
                // ==================================

                const riskCode =
                    Number(data.risk_code ?? 0);

                const safeRiskCode =
                    Math.max(0, Math.min(3, riskCode));

                setText(
                    "risk_label",
                    data.risk_label ?? "UNKNOWN"
                );

                document.getElementById("risk-banner").className =
                    "risk-banner risk-" + safeRiskCode;


                console.log("Sensor data updated:", data);

            }

            catch (error) {

                console.error(
                    "Dashboard update failed:",
                    error
                );

                status.innerText = "SERVER CONNECTION ERROR";
                status.className = "disconnected";

            }

        }


        // ==================================
        // AUTOMATIC REFRESH EVERY 2 SECONDS
        // ==================================

        fetchTelemetry();

        setInterval(fetchTelemetry, 2000);

    </script>

</body>

</html>
